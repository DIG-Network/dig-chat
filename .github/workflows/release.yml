name: Release

# The tag push and the release both need write access; nothing else does.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable]

env:
  NODE_VERSION: '20.19.4'

jobs:
  # The release is created as a DRAFT and published only once its artifacts are attached and
  # verified. Attaching an asset promotes a release to `latest`, so a release published before its
  # uploads would advertise a version the beacon can resolve a tag for and find no artifact behind.
  cut:
    name: cut the tag + draft the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The RELEASE_TOKEN identity, not GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN does not
          # fire tag-triggered workflows, and the release commit has to clear branch protection.
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: cut the tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")

          # A PUBLISHED release is immutable and must never be re-cut. A DRAFT one is the debris of
          # an attempt that failed after tagging — most likely a build leg — and refusing it would
          # force a version bump to recover from a transient failure, which is how a version series
          # grows holes. So: refuse the published case, resume the draft case.
          if gh release view "v$version" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "v$version" --json isDraft --jq .isDraft)" = "false" ]; then
              echo "::error::v$version is already published — bump package.json first"
              exit 1
            fi
            echo "v$version is a draft from an earlier attempt; resuming it"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version exists with no release behind it — delete the tag or bump"
            exit 1
          fi
          # A CI checkout carries no committer identity and `git tag -a` refuses without one. This
          # is the release automation's own identity, not a person's.
          git config user.name "dig-release"
          git config user.email "release@dig.net"
          git tag -a "v$version" -m "dig-chat v$version"
          git push origin "v$version"
          gh release create "v$version" --draft --title "dig-chat v$version" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os_token }}/x64 artifact
    needs: cut
    runs-on: ${{ matrix.runner }}
    strategy:
      # One leg failing must not cancel the other: knowing BOTH outcomes in one run is what turns a
      # re-dispatch into a single fix rather than a sequence of them.
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_token: windows
            builder_flag: --win
          - runner: ubuntu-latest
            os_token: linux
            builder_flag: --linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.cut.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: build the app bundles
        run: npm run build
      # `--publish never` keeps electron-builder out of the release entirely. Uploading is done
      # below, AFTER the shape of what was produced has been checked.
      - name: package a single-file artifact
        run: npx electron-builder ${{ matrix.builder_flag }} --x64 --publish never
      # "The build was green" is not "a usable artifact exists". This asserts one regular file of a
      # plausible size under the exact name the beacon reconstructs, and renames it if the target's
      # own extension is not part of that name.
      - name: stage the artifact under its release-asset name
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          staged=$(node scripts/stage-artifact-cli.mjs release "${{ needs.cut.outputs.version }}" "${{ matrix.os_token }}" x64)
          echo "path=$staged" >> "$GITHUB_OUTPUT"
          ls -l "$staged"
      - name: attach it to the draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh release upload "v${{ needs.cut.outputs.version }}" "${{ steps.stage.outputs.path }}" --clobber

  publish:
    name: verify the assets, then publish
    needs: [cut, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.cut.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Read the RELEASE's own asset list rather than trusting the build jobs: an upload can fail
      # after the step that produced the file has already succeeded, and an asset row exists before
      # its bytes do. Sizes are checked for exactly that reason.
      - name: the release must carry every expected artifact
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "v${{ needs.cut.outputs.version }}" --json assets \
            | node scripts/verify-release-assets-cli.mjs "${{ needs.cut.outputs.version }}"
      - name: publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh release edit "v${{ needs.cut.outputs.version }}" --draft=false --latest
      # A component release is INVISIBLE to every beacon until the update feed is re-signed, and the
      # feed's own cron is six-hourly — so without this the release looks perfectly green (tag live,
      # marked latest, all assets present) while nobody can actually receive it for up to six hours.
      # The coupling is invisible from this repo, which is why the natural place to look for that bug
      # is the wrong one. dig_ecosystem#3046.
      #
      # `repository_dispatch` specifically: it always runs on the DEFAULT branch, so the feed's
      # signing guard passes by construction. A `release`-triggered run would have `github.ref` set
      # to the tag, every job would silently skip, and the run would still report `completed`.
      - name: wake the update feed
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/DIG-Network/dig-updater/dispatches             -f event_type=component-released             -F 'client_payload[component]=dig-chat'             -F "client_payload[version]=${{ needs.cut.outputs.version }}"
