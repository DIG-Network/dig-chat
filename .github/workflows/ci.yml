name: CI

# Least privilege: every job here only reads the repository. Nothing in CI needs to write to it, and
# a default-permissive token on a workflow that runs untrusted PR code is how a repo gets rewritten.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.19.4'

jobs:
  quality:
    name: format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: format
        run: npm run format:check
      - name: lint (warnings are errors)
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      # Coverage thresholds live in vitest.config.ts (lines/branches/functions/statements >= 80),
      # so a suite that drops below the ecosystem floor fails HERE rather than in a review comment.
      - name: test + coverage
        run: npm run coverage
      - name: build
        run: npm run build

  # Packaging is exercised on every PR, not first discovered at release time. The value is not that
  # electron-builder exits zero — it is that the staging step then finds ONE regular file of a
  # plausible size under the exact name dig-updater reconstructs. A config change that silently stops
  # producing that file reds here instead of producing an unshippable release.
  package:
    name: single-file artifact (linux/x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --x64 --publish never
      - name: the build must yield one usable file under the beacon's expected name
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          staged=$(node scripts/stage-artifact-cli.mjs release "$version" linux x64)
          ls -l "$staged"
          test -f "$staged"

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The PR TITLE, because that is the message that lands on main: this repo squash-merges, and
      # the squash subject is the title. Linting every intermediate commit instead would gate the
      # branch on messages that are never published, and the only way to fix one after it is pushed
      # is to rewrite shared history — a cure worse than the disease.
      - name: lint the squash subject
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | npx commitlint --verbose

  version:
    name: version increment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the version must increase
        run: |
          set -euo pipefail
          # A repo's FIRST PR has no package.json on the base to compare against. That is not a
          # missing bump, it is the absence of a previous version, so the gate passes and starts
          # gating from the next PR onward.
          if ! git cat-file -e ${{ github.event.pull_request.base.sha }}:package.json 2>/dev/null; then
            echo "no package.json on the base commit — this is the first PR, nothing to compare"
            exit 0
          fi
          base=$(git show ${{ github.event.pull_request.base.sha }}:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          head=$(node -p "require('./package.json').version")
          echo "base=$base head=$head"
          if [ "$base" = "$head" ]; then
            echo "::error::package.json version is unchanged ($head). Bump it per SemVer (ecosystem §2.4)."
            exit 1
          fi
          # A pure string comparison would accept a DECREASE. Sorting both and taking the greater is
          # what makes this a monotonicity check rather than a difference check.
          greater=$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -1)
          if [ "$greater" != "$head" ]; then
            echo "::error::version went backwards: $base -> $head"
            exit 1
          fi
